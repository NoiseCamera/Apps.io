<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>すうじのけいさん</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="buttons.css">
</head>
<body>

    <header>
        <h1>すうじの けいさん</h1>
        <p>もんだいを といてみよう！</p>
    </header>

    <div id="game-options-container">
        <div class="setting-group">
            <div id="mode-selector">
                <button class="mode-btn selected" id="mode-mixed">まぜこぜ</button>
                <button class="mode-btn" id="mode-addition">たしざん</button>
                <button class="mode-btn" id="mode-subtraction">ひきざん</button>
            </div>
            <!-- ▼ トグルスイッチをここに追加 ▼ -->
            <div class="toggle-switch-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="carry-toggle">
                    <span class="slider"></span>
                </label>
                <span>くりあがり・くりさがり</span>
            </div>
        </div>
        <div id="difficulty-selector">
            <button class="difficulty-btn selected" id="difficulty-mixed">いろんな けた</button>
            <button class="difficulty-btn" id="difficulty-1">1けた</button>
            <button class="difficulty-btn" id="difficulty-2">2けた</button>
            <button class="difficulty-btn" id="difficulty-3">3けた</button>
        </div>
    </div>

    <main id="app-container" class="calculation-layout">
        <div id="left-items" class="item-container"></div>
        <div id="calculation-container">
            <div class="problem">
                <span id="num1"></span>
                <span id="operator"></span>
                <span id="num2"></span>
                <span>=</span>
            </div>
            <div class="answer-area">
                <div id="answer-input" class="answer-display" data-placeholder="こたえ"></div>
                <button id="hint-btn">💡</button>
            </div>
            <div id="number-buttons">
                <button class="number-btn">1</button><button class="number-btn">2</button><button class="number-btn">3</button><button class="number-btn">4</button><button class="number-btn">5</button>
                <button class="number-btn">6</button><button class="number-btn">7</button><button class="number-btn">8</button><button class="number-btn">9</button><button class="number-btn">0</button>
            </div>
            <div class="buttons">
                <button id="clear-btn">けす</button><button id="check-btn">こたえあわせ</button><button id="next-btn">つぎのもんだい</button>
            </div>
            <div id="feedback"></div>
        </div>
        <div id="right-items" class="item-container"></div>
    </main>

    <script src="script.js"></script>
    <script src="settings.js"></script>
</body>
</html>
