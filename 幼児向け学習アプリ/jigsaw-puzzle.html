<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>どうぶつジグソーパズル</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="jigsaw-puzzle.css">
</head>
<body>
  <audio id="bgm" src="assets/sounds/bgm3.mp3" loop></audio>
  <audio id="snap-sound" src="assets/sounds/kachi.mp3"></audio>
  <audio id="win-sound" src="assets/sounds/kirakira.mp3"></audio>

  <header>
    <h1>どうぶつジグソーパズル</h1>
  </header>

  <main id="game-area">
    <div id="puzzle-area">
      <div id="puzzle-container">
        <canvas id="puzzle-canvas"></canvas>
      </div>
      <div id="reference-container">
        <p>えを えらんでね</p>
        <img id="current-reference-image" src="assets/images/usagi.png" alt="完成図">
        <div id="animal-selector-grid"></div>
        <div id="difficulty-selector">
            <button class="difficulty-btn selected" data-size="4">かんたん (9)</button>
            <button class="difficulty-btn" data-size="6">ふつう (16)</button>
            <button class="difficulty-btn" data-size="8">むずかしい (25)</button>
        </div>
      </div>
    </div>
  </main>

  <div id="win-message" class="overlay hidden">
    <p>かんせい！おめでとう！</p>
    <img id="win-image" src="assets/images/usagi.png" alt="完成した絵">
    <div class="win-buttons">
      <button id="play-again-btn">もういちど あそぶ</button>
      <a href="index.html" id="back-to-menu-btn">えらぶがめんへ</a>
    </div>
  </div>

  <script src="jigsaw-puzzle.js"></script>
  <script src="settings.js"></script>
</body>
</html>
