<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ごほうびゲット！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="gacha.css">
    <link rel="stylesheet" href="buttons.css">
</head>
<body>
    <header>
        <h1>ごほうびゲット！</h1>
    </header>

    <main id="gacha-container">
        <div id="gacha-machine">
            <div id="gacha-display">
                <img src="assets/images/treasure_chest_closed.png" alt="たからばこ" id="gacha-image">
            </div>
            <button id="gacha-button">
                <span class="star-icon">★</span> 3こ で ひく
            </button>
        </div>

        <div id="reward-modal" class="hidden">
            <div class="reward-content">
                <h2>やったね！</h2>
                <img id="reward-image" src="" alt="ごほうび">
                <p id="reward-name"></p>
                <button id="close-reward-btn">とじる</button>
            </div>
        </div>
    </main>

    <button id="footer-nav-button" class="back-to-menu">えらぶがめんに もどる</button>

    <script src="settings.js"></script>
    <script src="gacha.js"></script>
</body>
</html>
