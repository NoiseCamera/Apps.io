<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コレクション</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="collection.css">
    <link rel="stylesheet" href="buttons.css">
</head>
<body>
    <header>
        <h1>コレクション</h1>
    </header>

    <main>
        <p id="collection-stats">あつめたかず： 0 / 20</p>
        <div id="collection-grid">
            <!-- JavaScriptでアイテムがここに追加されます -->
        </div>

        <!-- コンプリート報酬エリア (最初は非表示) -->
        <div id="complete-reward" class="hidden">
            <h2>ぜんぶ あつめたね！ おめでとう！</h2>
            <p>ごほうびに「すきな おかしが かえるけん」をプレゼント！</p>
            <div id="reward-ticket">
                <h3>★ ごほうびけん ★</h3>
                <p>すきな おかし ひとつと<br>こうかんできるよ！</p>
            </div>
            <p>このけんをつかうと、また あつめなおせるよ！</p>
            <div class="complete-buttons">
                <button id="toggle-collection-view-btn">あつめたコレクションを見る</button>
                <button id="use-reward-btn">けんをつかう</button>
            </div>
        </div>

        <!-- アイテム詳細表示用モーダル -->
        <div id="item-detail-modal" class="hidden">
            <div class="modal-content">
                <img id="modal-item-image" src="" alt="コレクションアイテム">
                <p id="modal-item-name"></p>
                <button id="close-detail-modal-btn">とじる</button>
            </div>
        </div>
    </main>

    <button id="footer-nav-button" class="back-to-menu">えらぶがめんに もどる</button>

    <script src="settings.js"></script>
    <script src="collection.js"></script>
</body>
</html>
