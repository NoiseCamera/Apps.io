<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>えあわせゲーム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="memory-game.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <audio id="bgm" src="assets/sounds/bgm6.mp3" loop></audio>
    <div id="app-container">
        <header>
            <h1>えあわせゲーム</h1>
        </header>

        <main id="game-area">
            <div id="puzzle-container">
                <div class="stats-container">
                    <!-- ひとりであそぶ用 -->
                    <div id="single-player-stats" class="stat-group">
                        <div class="stat-item">
                            <span class="stat-label">てかず:</span>
                            <span id="move-count">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">じかん:</span>
                            <span id="time-count">00:00</span>
                        </div>
                    </div>
                    <!-- ふたりであそぶ用 (最初は非表示) -->
                    <div id="multiplayer-stats" class="stat-group hidden">
                        <div id="player1-stat" class="stat-item player-stat">
                            <span id="player1-label" class="stat-label">プレイヤー1:</span>
                            <span id="player1-score">0</span>
                        </div>
                        <div id="player2-stat" class="stat-item player-stat">
                            <span id="player2-label" class="stat-label">プレイヤー2:</span>
                            <span id="player2-score">0</span>
                        </div>
                    </div>
                </div>
                <div id="memory-grid">
                    <!-- Cards will be generated by JavaScript -->
                </div>
                <!-- CPU Thinking Overlay -->
                <div id="cpu-thinking-overlay" class="hidden">
                    <div class="thinking-spinner">
                        <div class="dot1"></div>
                        <div class="dot2"></div>
                        <div class="dot3"></div>
                    </div>
                    <p>かんがえちゅう...</p>
                </div>
            </div>
        </main>

        <!-- Win Modal -->
        <div id="win-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <h2 id="win-title">クリア！</h2>
                <p id="win-message" class="hidden"></p>
                <!-- ひとりであそぶ用 結果 -->
                <div id="win-stats-single">
                    <div id="win-stats">
                        <p>かかったじかん: <span id="win-time"></span></p>
                        <p>てかず: <span id="win-moves"></span></p>
                    </div>
                    <p class="points-feedback">★ ほしを <span id="win-points"></span>こ ゲット！ ★</p>
                </div>
                <!-- ふたりであそぶ用 結果 -->
                <div id="win-stats-multi" class="hidden">
                     <p>プレイヤー1: <span id="win-score1"></span>ペア</p>
                     <p>プレイヤー2: <span id="win-score2"></span>ペア</p>
                </div>
                <button id="play-again-btn" class="button-style">もういっかい あそぶ</button>
            </div>
        </div>

        <!-- Title Screen -->
        <div id="title-screen" class="modal-overlay">
            <div class="modal-content">
                <h2>えあわせゲーム</h2>
                <p>おなじ え のカードを みつけてね！</p>
                <div id="mode-selector" class="control-panel">
                    <button class="mode-btn selected" data-mode="single">ひとりであそぶ</button>
                    <button class="mode-btn" data-mode="multi">ふたりであそぶ</button>
                    <button class="mode-btn" data-mode="cpu">コンピュータとたいせん</button>
                </div>
                <div id="cpu-level-selector" class="control-panel hidden">
                    <button class="cpu-level-btn selected" data-level="easy">よわい</button>
                    <button class="cpu-level-btn" data-level="medium">ふつう</button>
                    <button class="cpu-level-btn" data-level="hard">つよい</button>
                </div>
                <div id="difficulty-selector" class="control-panel">
                    <button class="difficulty-btn selected" data-size="4">かんたん</button>
                    <button class="difficulty-btn" data-size="6">ふつう</button>
                    <button class="difficulty-btn" data-size="8">むずかしい</button>
                </div>
                <button id="start-btn" class="button-style">スタート！</button>
            </div>
        </div>
    </div>

    <!-- Shared scripts -->
    <script src="settings.js"></script>
    <!-- Game specific script -->
    <script src="memory-game.js"></script>
</body>
</html>
