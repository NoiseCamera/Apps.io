\"absolute rounded-full border-2 border-white/80 pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 shadow-lg\"\n                    style={{ \n                        left: cursorPos.x, \n                        top: cursorPos.y, \n                        width: visibleBrushSize, \n                        height: visibleBrushSize,\n                        backgroundColor: 'rgba(255, 255, 255, 0.2)'\n                    }}\n                />\n            )}\n            \n            {transform.scale > 1 && (\n                <button \n                    onClick={resetZoom}\n                    className=\"absolute bottom-24 left-4 bg-slate-800/80 text-white text-xs px-3 py-1.5 rounded-full border border-slate-600 backdrop-blur shadow-lg z-20\"\n                >\n                    リセット ({Math.round(transform.scale * 100)}%)\n                </button>\n            )}\n\n            {isAiLoading && (\n                <div className=\"absolute inset-0 flex items-center justify-center z-50 bg-black/60 backdrop-blur-sm\">\n                    <div className=\"bg-cos-panel p-6 rounded-2xl border border-slate-700 flex flex-col items-center shadow-2xl\">\n                        <Spinner />\n                        <p className=\"mt-4 text-sm text-white font-bold tracking-wide\">AI解析中...</p>\n                        <p className=\"text-xs text-cos-muted mt-1\">{currentAiTarget}を抽出しています</p>\n                    </div>\n                </div>\n            )}\n\n            {showAiMenu && (\n                <div className=\"absolute inset-0 z-40 bg-black/50 backdrop-blur-sm flex items-end justify-center pb-32\" onClick={() => setShowAiMenu(false)}>\n                    <div className=\"bg-cos-panel border border-slate-700 rounded-xl shadow-2xl w-64 overflow-hidden animate-slide-up\" onClick={e => e.stopPropagation()}>\n                        <div className=\"px-4 py-3 border-b border-slate-700 bg-slate-800\">\n                            <h3 className=\"text-xs font-bold text-white uppercase tracking-wider\">AI 自動マスク選択</h3>\n                        </div>\n                        <div className=\"divide-y divide-slate-700 max-h-64 overflow-y-auto no-scrollbar\">\n                            {maskOptions.map(opt => (\n                                <button \n                                    key={opt.id}\n                                    onClick={() => handleAutoMask(opt.id)}\n                                    className=\"w-full text-left px-4 py-3 text-sm text-slate-200 hover:bg-cos-accent hover:text-white transition-colors flex items-center justify-between\"\n                                >\n                                    {opt.label}\n                                    <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-4 w-4 opacity-50\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M9 5l7 7-7 7\" /></svg>\n                                </button>\n                            ))}\n                        </div>\n                    </div>\n                </div>\n            )}\n        </div>\n\n        <div className=\"bg-black/80 backdrop-blur p-4 border-t border-white/10 safe-area-bottom shrink-0\">\n            <div className=\"max-w-lg mx-auto space-y-4\">\n                {/* Tools */}\n                <div className=\"flex justify-center gap-2 mb-2 overflow-x-auto pb-2 no-scrollbar\">\n                    <button onClick={() => setShowAiMenu(!showAiMenu)} className={`flex flex-col items-center gap-1 p-2 rounded-lg w-16 transition-all shrink-0 ${showAiMenu ? 'bg-white text-cos-accent scale-105' : 'bg-gradient-to-br from-purple-600 to-blue-600 text-white'}`}>\n                         <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z\" /></svg>\n                        <span className=\"text-[10px] font-bold\">リスト</span>\n                    </button>\n                    <div className=\"w-px bg-white/10 mx-1\"></div>\n\n                    <button onClick={() => setActiveTool('magic')} className={`flex flex-col items-center gap-1 p-2 rounded-lg w-16 ${activeTool === 'magic' ? 'bg-cos-accent text-white' : 'bg-white/10 text-white/60'} shrink-0`}>\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path fillRule=\"evenodd\" d=\"M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z\" clipRule=\"evenodd\" /></svg>\n                        <span className=\"text-[10px] font-bold\">自動選択</span>\n                    </button>\n                    \n                    <button onClick={() => setActiveTool('brush')} className={`flex flex-col items-center gap-1 p-2 rounded-lg w-16 ${activeTool === 'brush' ? 'bg-cos-accent text-white' : 'bg-white/10 text-white/60'} shrink-0`}>\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z\" /></svg>\n                        <span className=\"text-[10px]\">描画</span>\n                    </button>\n                    <button onClick={() => setActiveTool('eraser')} className={`flex flex-col items-center gap-1 p-2 rounded-lg w-16 ${activeTool === 'eraser' ? 'bg-cos-accent text-white' : 'bg-white/10 text-white/60'} shrink-0`}>\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fillRule=\"evenodd\" d=\"M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z\" clipRule=\"evenodd\" /></svg>\n                        <span className=\"text-[10px]\">消しゴム</span>\n                    </button>\n                    <div className=\"w-px bg-white/10 mx-1\"></div>\n                    <button onClick={handleInvert} className=\"flex flex-col items-center gap-1 p-2 rounded-lg bg-white/10 text-white/60 hover:text-white shrink-0\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4\" /></svg>\n                        <span className=\"text-[10px]\">反転</span>\n                    </button>\n                    <button onClick={handleClear} className=\"flex flex-col items-center gap-1 p-2 rounded-lg bg-white/10 text-white/60 hover:text-white shrink-0\">\n                        <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\" /></svg>\n                        <span className=\"text-[10px]\">全消去</span>\n                    </button>\n                </div>\n\n                {/* Sliders */}\n                {activeTool !== 'magic' && (\n                    <div className=\"grid grid-cols-3 gap-4 animate-fade-in\">\n                        <Slider label=\"サイズ\" value={brushSize} min={5} max={150} onChange={setBrushSize} onReset={() => setBrushSize(50)} />\n                        <Slider label=\"ぼかし\" value={100 - brushHardness} min={0} max={100} onChange={(v) => setBrushHardness(100 - v)} onReset={() => setBrushHardness(80)} />\n                        <Slider label=\"濃度\" value={brushOpacity} min={10} max={100} onChange={setBrushOpacity} onReset={() => setBrushOpacity(100)} unit=\"%\" />\n                    </div>\n                )}\n                \n                {activeTool === 'magic' && (\n                     <div className=\"text-center text-xs text-white/60 py-2 animate-fade-in\">\n                         画面上の選択したい物体をタップしてください\n                     </div>\n                )}\n\n                <div className=\"flex justify-center\">\n                    <button onClick={onCancel} className=\"text-xs text-white/60 py-2\">キャンセル</button>\n                </div>\n            </div>\n        </div>\n    </div>\n  );\n};\n","components/MeishiEditor.tsx":"\nimport React, { useRef, useEffect, useState } from 'react';\nimport { Button } from './Button';\nimport { Spinner } from './Spinner';\nimport { MeishiState, ElementPos, FrameStyle, QRStyle, MeishiPattern } from '../types';\nimport { MEISHI_PRESETS } from '../data/meishiPresets';\nimport { DEFAULT_MEISHI_STATE } from '../constants';\nimport { IconAlignLeft, IconAlignCenter, IconAlignRight, IconEye, IconDownload, IconX } from './Icon';\n\ninterface MeishiEditorProps {\n  imageSrc: string;\n  initialState: MeishiState;\n  onChange: (state: MeishiState) => void;\n  onClose: () => void;\n  onEditImage: () => void;\n}\n\n// Constants\nconst CARD_WIDTH = 1075; // ~91mm @ 300dpi\nconst CARD_HEIGHT = 650; // ~55mm @ 300dpi\n\ntype DragTarget = 'photo' | 'name' | 'details' | 'qr' | 'none';\ntype DragAction = 'move' | 'scale';\ntype EditorTab = 'templates' | 'content' | 'style' | 'arrange';\n\n// Extended Font List (20 Fonts)\nconst AVAILABLE_FONTS = [\n    { name: 'Noto Sans JP', family: \"'Noto Sans JP', sans-serif\" },\n    { name: 'Noto Serif JP', family: \"'Noto Serif JP', serif\" },\n    { name: 'M PLUS Rounded 1c', family: \"'M PLUS Rounded 1c', sans-serif\" },\n    { name: 'Kaisei Opti', family: \"'Kaisei Opti', serif\" },\n    { name: 'DotGothic16', family: \"'DotGothic16', sans-serif\" },\n    { name: 'Yuji Syuku', family: \"'Yuji Syuku', serif\" },\n    { name: 'Hachi Maru Pop', family: \"'Hachi Maru Pop', cursive\" },\n    { name: 'Zen Kaku Gothic', family: \"'Zen Kaku Gothic New', sans-serif\" },\n    { name: 'Zen Maru Gothic', family: \"'Zen Maru Gothic', sans-serif\" },\n    { name: 'Sawarabi Mincho', family: \"'Sawarabi Mincho', serif\" },\n    { name: 'Sawarabi Gothic', family: \"'Sawarabi Gothic', sans-serif\" },\n    { name: 'Dela Gothic One', family: \"'Dela Gothic One', sans-serif\" },\n    { name: 'RocknRoll One', family: \"'RocknRoll One', sans-serif\" },\n    { name: 'Reggae One', family: \"'Reggae One', sans-serif\" },\n    { name: 'Potta One', family: \"'Potta One', cursive\" },\n    { name: 'Shippori Mincho', family: \"'Shippori Mincho', serif\" },\n    { name: 'Klee One', family: \"'Klee One', cursive\" },\n    { name: 'Train One', family: \"'Train One', cursive\" },\n    { name: 'Rampart One', family: \"'Rampart One', sans-serif\" },\n    { name: 'Kaisei Decol', family: \"'Kaisei Decol', serif\" },\n];\n\nexport const MeishiEditor: React.FC<MeishiEditorProps> = ({ imageSrc, initialState, onChange, onClose, onEditImage }) => {\n  const canvasRef = useRef<HTMLCanvasElement>(null);\n  const [activeTab, setActiveTab] = useState<EditorTab>('templates');\n  const [isProcessing, setIsProcessing] = useState(false);\n  const [processingType, setProcessingType] = useState<'card' | 'a4'>('card');\n  const [a4PreviewSrc, setA4PreviewSrc] = useState<string | null>(null);\n  const [isPreviewMode, setIsPreviewMode] = useState(false);\n  \n  // Drag State\n  const [dragTarget, setDragTarget] = useState<DragTarget>('none');\n  const [dragAction, setDragAction] = useState<DragAction>('move');\n  const pointerStart = useRef<{x: number, y: number} | null>(null);\n  const initialElPos = useRef<ElementPos | null>(null); \n  \n  // To store calculated bounds for hit testing\n  const elementBounds = useRef<Map<DragTarget, { x: number, y: number, w: number, h: number, angle: number }>>(new Map());\n\n  const [loadedImg, setLoadedImg] = useState<HTMLImageElement | null>(null);\n  const [customFonts, setCustomFonts] = useState<{name: string, family: string}[]>([]);\n  \n  const width = initialState.isVertical ? CARD_HEIGHT : CARD_WIDTH;\n  const height = initialState.isVertical ? CARD_WIDTH : CARD_HEIGHT;\n\n  // Load Image Once\n  useEffect(() => {\n      const img = new Image();\n      img.crossOrigin = 'anonymous';\n      img.src = imageSrc;\n      img.onload = () => {\n          setLoadedImg(img);\n      };\n  }, [imageSrc]);\n\n  // Render Loop\n  useEffect(() => {\n      const canvas = canvasRef.current;\n      if (!canvas || !loadedImg) return;\n      const ctx = canvas.getContext('2d');\n      if (!ctx) return;\n\n      draw(ctx, loadedImg, isPreviewMode); // Don't show guides/handles in preview mode\n      \n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [loadedImg, initialState, width, height, dragTarget, customFonts, isPreviewMode]);\n\n  const generateQR = (data: string): boolean[][] | null => {\n      if (typeof window.qrcode !== 'function') return null;\n      for (let type = 1; type <= 40; type++) {\n          try {\n              const qr = window.qrcode(type, 'M');\n              qr.addData(data);\n              qr.make();\n              const count = qr.getModuleCount();\n              const modules: boolean[][] = [];\n              for(let r=0; r<count; r++){\n                  const row: boolean[] = [];\n                  for(let c=0; c<count; c++){\n                      row.push(qr.isDark(r, c));\n                  }\n                  modules.push(row);\n              }\n              return modules;\n          } catch(e) {\n              continue; \n          }\n      }\n      return null;\n  };\n\n  const drawPattern = (ctx: CanvasRenderingContext2D, w: number, h: number, type: MeishiPattern, color: string, opacity: number) => {\n      if (type === 'none' || opacity <= 0) return;\n\n      // Ensure color is valid to prevent slice errors\n      const safeColor = (color && color.startsWith('#')) ? color : '#000000';\n\n      ctx.save();\n      ctx.globalAlpha = opacity / 100;\n      ctx.fillStyle = safeColor;\n      ctx.strokeStyle = safeColor;\n\n      if (type === 'dots') {\n          const size = 15;\n          const spacing = 40;\n          for(let y=0; y<h; y+=spacing) {\n              for(let x=0; x<w; x+=spacing) {\n                  ctx.beginPath(); ctx.arc(x + (y%(spacing*2)===0?0:spacing/2), y, size/2, 0, Math.PI*2); ctx.fill();\n              }\n          }\n      } else if (type === 'grid') {\n          const spacing = 50;\n          ctx.lineWidth = 2;\n          for(let x=0; x<w; x+=spacing) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }\n          for(let y=0; y<h; y+=spacing) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }\n      } else if (type === 'stripes') {\n          const spacing = 30;\n          ctx.lineWidth = 10;\n          // Diagonal stripes\n          for(let i = -h; i < w; i+=spacing) {\n              ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+h, h); ctx.stroke();\n          }\n      } else if (type === 'checkers') {\n          const size = 60;\n          for(let y=0; y<h; y+=size) {\n              for(let x=0; x<w; x+=size) {\n                  if ((x/size + y/size) % 2 === 0) ctx.fillRect(x, y, size, size);\n              }\n          }\n      } else if (type === 'seigaiha') {\n          ctx.lineWidth = 3;\n          const r = 40;\n          for(let y=0; y<h+r; y+=r*0.8) {\n              for(let x=0; x<w+r; x+=r*2) {\n                  const cx = x + (Math.round(y/(r*0.8))%2===0 ? 0 : r);\n                  ctx.beginPath(); ctx.arc(cx, y, r, Math.PI, 0); ctx.stroke();\n                  ctx.beginPath(); ctx.arc(cx, y, r*0.7, Math.PI, 0); ctx.stroke();\n                  ctx.beginPath(); ctx.arc(cx, y, r*0.4, Math.PI, 0); ctx.stroke();\n              }\n          }\n      } else if (type === 'yagasuri') {\n          const size = 40;\n          for(let y=0; y<h; y+=size*2) {\n              for(let x=0; x<w; x+=size) {\n                  // Simplified Yagasuri representation\n                  ctx.beginPath();\n                  ctx.moveTo(x, y); ctx.lineTo(x+size/2, y+size); ctx.lineTo(x, y+size*2);\n                  ctx.moveTo(x+size/2, y); ctx.lineTo(x, y+size); ctx.lineTo(x+size/2, y+size*2);\n                  ctx.stroke();\n              }\n          }\n      } else if (type === 'noise') {\n          // Simple noise simulation compatible with color tinting\n          // Fallback to simple random rects for performance in React canvas draw\n          for(let i=0; i<2000; i++) ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);\n      }\n\n      ctx.restore();\n  }\n\n  const draw = (ctx: CanvasRenderingContext2D, img: HTMLImageElement, exportMode: boolean = false) => {\n      ctx.clearRect(0, 0, width, height);\n      if (!exportMode) elementBounds.current.clear();\n      \n      // 1. Background\n      ctx.fillStyle = initialState.backgroundColor;\n      ctx.fillRect(0, 0, width, height);\n\n      // Pattern\n      if (initialState.backgroundPattern !== 'none') {\n          drawPattern(ctx, width, height, initialState.backgroundPattern, initialState.backgroundPatternColor, initialState.backgroundPatternOpacity);\n      }\n\n      // 2. Photo\n      if (initialState.photoPos.visible) {\n          const { photoPos } = initialState;\n          \n          ctx.save();\n          const cx = photoPos.x * width;\n          const cy = photoPos.y * height;\n          \n          ctx.translate(cx, cy);\n          if (photoPos.rotate) ctx.rotate((photoPos.rotate * Math.PI) / 180);\n          \n          let drawW, drawH;\n          \n          if (photoPos.fit === 'cover') {\n              const ratio = Math.max(width / img.width, height / img.height);\n              const scale = ratio * photoPos.scale;\n              drawW = img.width * scale;\n              drawH = img.height * scale;\n          } else if (photoPos.fit === 'stretch') {\n              drawW = width * photoPos.scale;\n              drawH = height * photoPos.scale;\n          } else {\n              const ratio = Math.min(width / img.width, height / img.height);\n              const scale = ratio * photoPos.scale;\n              drawW = img.width * scale;\n              drawH = img.height * scale;\n          }\n          \n          ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);\n          \n          // Store bounds\n          if (!exportMode) elementBounds.current.set('photo', { x: cx, y: cy, w: drawW, h: drawH, angle: photoPos.rotate || 0 });\n\n          if (!exportMode && dragTarget === 'photo') {\n              drawSelection(ctx, 0, 0, drawW, drawH);\n              drawResizeHandle(ctx, drawW/2, drawH/2);\n          }\n\n          ctx.restore();\n      }\n\n      // 3. Frame\n      drawFrame(ctx, width, height, initialState.frameStyle, initialState.themeColor, initialState.subColor);\n\n      // 4. Text Common Config\n      const baseSize = (initialState.isVertical ? CARD_WIDTH : CARD_HEIGHT) / 20;\n      let fontCSS = AVAILABLE_FONTS.find(f => f.name === initialState.fontFamily)?.family \n                 || customFonts.find(f => f.name === initialState.fontFamily)?.family \n                 || \"'Noto Sans JP', sans-serif\";\n      const weight = initialState.fontWeight || 700;\n\n      // Draw Name\n      if (initialState.namePos.visible) {\n          const { namePos } = initialState;\n          const size = baseSize * 2 * namePos.scale;\n          ctx.font = `${weight} ${size}px ${fontCSS}`;\n          ctx.textAlign = (namePos.align as CanvasTextAlign) || 'center';\n          ctx.textBaseline = 'middle';\n          ctx.fillStyle = initialState.nameColor || initialState.textColor;\n          \n          const tx = namePos.x * width;\n          const ty = namePos.y * height;\n          \n          const text = initialState.name || 'Name';\n          const metrics = ctx.measureText(text);\n          const boundW = metrics.width;\n          const boundH = size; // Approximate\n          \n          ctx.save();\n          ctx.translate(tx, ty);\n          if (namePos.rotate) ctx.rotate((namePos.rotate * Math.PI) / 180);\n          \n          ctx.beginPath(); \n          if (initialState.textStroke) {\n              ctx.lineWidth = size * 0.08;\n              ctx.strokeStyle = initialState.backgroundColor === '#000000' ? '#fff' : initialState.themeColor; \n              ctx.lineJoin = 'round';\n              ctx.strokeText(text, 0, 0);\n          }\n          if (initialState.textShadow) {\n              ctx.shadowColor = 'rgba(0,0,0,0.5)';\n              ctx.shadowBlur = 6;\n              ctx.shadowOffsetX = 2;\n              ctx.shadowOffsetY = 2;\n          }\n          ctx.fillText(text, 0, 0);\n          \n          // Adjust bounding box based on alignment\n          let bx = 0;\n          if (ctx.textAlign === 'left') bx = boundW/2;\n          if (ctx.textAlign === 'right') bx = -boundW/2;\n\n          // Draw UI if selected\n          if (!exportMode && dragTarget === 'name') {\n              drawSelection(ctx, bx, 0, boundW + 20, boundH + 20);\n              drawResizeHandle(ctx, bx + (boundW+20)/2, (boundH+20)/2);\n          }\n          \n          if (!exportMode) elementBounds.current.set('name', { x: tx, y: ty, w: boundW, h: boundH, angle: namePos.rotate || 0 });\n          ctx.restore();\n      }\n\n      // Draw Details\n      if (initialState.detailsPos.visible) {\n          const { detailsPos } = initialState;\n          const size = baseSize * 0.9 * detailsPos.scale;\n          ctx.font = `${weight} ${size}px ${fontCSS}`;\n          ctx.textAlign = (detailsPos.align as CanvasTextAlign) || 'center';\n          ctx.textBaseline = 'middle';\n          ctx.fillStyle = initialState.detailsColor || initialState.textColor;\n\n          const tx = detailsPos.x * width;\n          const ty = detailsPos.y * height;\n          const lineHeight = size * (initialState.detailsLineHeight || 1.5);\n\n          const lines = [];\n          if (initialState.twitterId) lines.push(`X: @${initialState.twitterId}`);\n          if (initialState.instagramId) lines.push(`IG: @${initialState.instagramId}`);\n          if (initialState.freeText) lines.push(initialState.freeText);\n\n          // Calc Bounds\n          let maxW = 0;\n          lines.forEach(l => {\n              const m = ctx.measureText(l);\n              if (m.width > maxW) maxW = m.width;\n          });\n          const totalH = lines.length * lineHeight;\n          \n          ctx.save();\n          ctx.translate(tx, ty);\n          if (detailsPos.rotate) ctx.rotate((detailsPos.rotate * Math.PI) / 180);\n          \n          let currentY = -(totalH / 2) + (lineHeight / 2);\n\n          lines.forEach(line => {\n              if (initialState.textStroke) {\n                  ctx.lineWidth = size * 0.1;\n                  ctx.strokeStyle = initialState.backgroundColor === '#000000' ? '#fff' : '#fff';\n                  ctx.lineJoin = 'round';\n                  ctx.strokeText(line, 0, currentY);\n              }\n              if (initialState.textShadow) {\n                ctx.shadowColor = 'rgba(0,0,0,0.5)';\n                ctx.shadowBlur = 4;\n                ctx.shadowOffsetX = 1;\n                ctx.shadowOffsetY = 1;\n              }\n              ctx.fillText(line, 0, currentY);\n              currentY += lineHeight;\n          });\n\n          // Adjust bounding box for selection\n          let bx = 0;\n          if (ctx.textAlign === 'left') bx = maxW/2;\n          if (ctx.textAlign === 'right') bx = -maxW/2;\n\n          if (!exportMode && dragTarget === 'details') {\n              drawSelection(ctx, bx, 0, maxW + 20, totalH + 10);\n              drawResizeHandle(ctx, bx + (maxW+20)/2, (totalH+10)/2);\n          }\n          \n          if (!exportMode) elementBounds.current.set('details', { x: tx, y: ty, w: maxW, h: totalH, angle: detailsPos.rotate || 0 });\n          ctx.restore();\n      }\n\n      // 5. QR Code\n      if (initialState.qrPos.visible && (initialState.twitterId || initialState.instagramId)) {\n          const { qrPos } = initialState;\n          const size = (initialState.isVertical ? CARD_WIDTH : CARD_HEIGHT) * 0.25 * qrPos.scale;\n          const qx = qrPos.x * width;\n          const qy = qrPos.y * height;\n          \n          const url = initialState.twitterId \n            ? `https://twitter.com/${initialState.twitterId.replace('@','')}` \n            : `https://instagram.com/${initialState.instagramId}`;\n\n          const modules = generateQR(url);\n          \n          ctx.save();\n          ctx.translate(qx, qy);\n          if (qrPos.rotate) ctx.rotate((qrPos.rotate * Math.PI) / 180);\n          \n          if (initialState.qrBgColor !== 'transparent') {\n              ctx.fillStyle = initialState.qrBgColor;\n              if (initialState.qrStyle === 'rounded' || initialState.qrStyle === 'dots') {\n                  roundRect(ctx, -size/2 - 10, -size/2 - 10, size + 20, size + 20, 15);\n                  ctx.fill();\n              } else {\n                  ctx.fillRect(-size/2 - 10, -size/2 - 10, size + 20, size + 20);\n              }\n          }\n\n          if (modules) {\n              const count = modules.length;\n              const tileSize = size / count;\n              ctx.fillStyle = initialState.qrColor;\n              for (let r = 0; r < count; r++) {\n                  for (let c = 0; c < count; c++) {\n                      if (modules[r][c]) {\n                          const x = -size/2 + c * tileSize;\n                          const y = -size/2 + r * tileSize;\n                          if (initialState.qrStyle === 'dots') {\n                                ctx.beginPath();\n                                ctx.arc(x + tileSize/2, y + tileSize/2, tileSize/2 * 0.9, 0, Math.PI*2);\n                                ctx.fill();\n                          } else if (initialState.qrStyle === 'rounded') {\n                                roundRect(ctx, x, y, tileSize, tileSize, tileSize * 0.3);\n                                ctx.fill();\n                          } else {\n                              ctx.fillRect(x, y, tileSize + 0.5, tileSize + 0.5);\n                          }\n                      }\n                  }\n              }\n          }\n          \n          if (!exportMode && dragTarget === 'qr') {\n              drawSelection(ctx, 0, 0, size+20, size+20);\n              drawResizeHandle(ctx, size/2 + 10, size/2 + 10);\n          }\n          \n          if (!exportMode) elementBounds.current.set('qr', { x: qx, y: qy, w: size, h: size, angle: qrPos.rotate || 0 });\n          ctx.restore();\n      }\n  };\n\n  // --- Drawing Helpers ---\n\n  const drawFrame = (ctx: CanvasRenderingContext2D, w: number, h: number, style: FrameStyle, color: string, sub: string) => {\n      if (style === 'none') return;\n      \n      const pad = 30;\n      ctx.lineWidth = 15;\n      ctx.strokeStyle = color;\n      ctx.fillStyle = color;\n      \n      if (style === 'simple') {\n          ctx.strokeRect(pad, pad, w - pad*2, h - pad*2);\n      } else if (style === 'thick') {\n          ctx.lineWidth = 40;\n          ctx.strokeRect(20, 20, w - 40, h - 40);\n      } else if (style === 'double') {\n          ctx.lineWidth = 8;\n          ctx.strokeRect(pad, pad, w - pad*2, h - pad*2);\n          ctx.strokeStyle = sub;\n          ctx.strokeRect(pad + 15, pad + 15, w - (pad+15)*2, h - (pad+15)*2);\n      } else if (style === 'corners') {\n          const len = 150;\n          ctx.lineWidth = 20;\n          ctx.beginPath(); ctx.moveTo(pad, pad + len); ctx.lineTo(pad, pad); ctx.lineTo(pad + len, pad); ctx.stroke();\n          ctx.beginPath(); ctx.moveTo(w-pad, pad + len); ctx.lineTo(w-pad, pad); ctx.lineTo(w-pad - len, pad); ctx.stroke();\n          ctx.beginPath(); ctx.moveTo(w-pad, h-pad - len); ctx.lineTo(w-pad, h-pad); ctx.lineTo(w-pad - len, h-pad); ctx.stroke();\n          ctx.beginPath(); ctx.moveTo(pad, h-pad - len); ctx.lineTo(pad, h-pad); ctx.lineTo(pad + len, h-pad); ctx.stroke();\n      } else if (style === 'bracket') {\n          const indent = w * 0.1;\n          ctx.lineWidth = 30;\n          ctx.beginPath(); ctx.moveTo(indent, pad); ctx.lineTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(indent, h-pad); ctx.stroke();\n          ctx.beginPath(); ctx.moveTo(w-indent, pad); ctx.lineTo(w-pad, pad); ctx.lineTo(w-pad, h-pad); ctx.lineTo(w-indent, h-pad); ctx.stroke();\n      } else if (style === 'top-bottom') {\n          const barH = h * 0.15;\n          ctx.fillStyle = color;\n          ctx.fillRect(0, 0, w, barH);\n          ctx.fillStyle = sub;\n          ctx.fillRect(0, h - barH, w, barH);\n      } else if (style === 'cyber') {\n          ctx.lineWidth = 4;\n          ctx.strokeStyle = color;\n          ctx.strokeRect(pad, pad, w-pad*2, h-pad*2);\n          const len = 100;\n          ctx.lineWidth = 15;\n          ctx.beginPath(); ctx.moveTo(pad, pad+len); ctx.lineTo(pad, pad); ctx.lineTo(pad+len, pad); ctx.stroke();\n          ctx.beginPath(); ctx.moveTo(w-pad, h-pad-len); ctx.lineTo(w-pad, h-pad); ctx.lineTo(w-pad-len, h-pad); ctx.stroke();\n          ctx.fillStyle = sub;\n          ctx.fillRect(w-pad-40, pad, 40, 40);\n          ctx.fillRect(pad, h-pad-40, 40, 40);\n      } else if (style === 'modern') {\n          const barW = w * 0.25;\n          ctx.fillStyle = color;\n          if (initialState.isVertical) {\n             ctx.fillRect(0, h - w*0.25, w, w*0.25);\n          } else {\n             ctx.fillRect(0, 0, barW, h);\n          }\n      }\n  };\n\n  const roundRect = (ctx: CanvasRenderingContext2D, x: number, y: number, w: number, h: number, r: number) => {\n      if (w < 2 * r) r = w / 2;\n      if (h < 2 * r) r = h / 2;\n      ctx.beginPath();\n      ctx.moveTo(x + r, y);\n      ctx.arcTo(x + w, y, x + w, y + h, r);\n      ctx.arcTo(x + w, y + h, x, y + h, r);\n      ctx.arcTo(x, y + h, x, y, r);\n      ctx.arcTo(x, y, x + w, y, r);\n      ctx.closePath();\n  }\n\n  const drawSelection = (ctx: CanvasRenderingContext2D, x: number, y: number, w: number, h: number) => {\n      ctx.strokeStyle = '#ec4899';\n      ctx.lineWidth = 4;\n      ctx.setLineDash([10, 10]);\n      ctx.strokeRect(x - w/2, y - h/2, w, h);\n      ctx.setLineDash([]);\n  }\n\n  const drawResizeHandle = (ctx: CanvasRenderingContext2D, x: number, y: number) => {\n      ctx.fillStyle = '#ec4899';\n      ctx.beginPath();\n      ctx.arc(x, y, 15, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.strokeStyle = '#ffffff';\n      ctx.lineWidth = 3;\n      ctx.stroke();\n  }\n\n  // --- Interactions ---\n\n  const getPointerLocal = (e: React.PointerEvent, canvas: HTMLCanvasElement) => {\n      const rect = canvas.getBoundingClientRect();\n      return {\n          x: (e.clientX - rect.left) / rect.width * width,\n          y: (e.clientY - rect.top) / rect.height * height\n      };\n  }\n\n  const checkHandleHit = (px: number, py: number, target: DragTarget, align?: string): boolean => {\n      const b = elementBounds.current.get(target);\n      if (!b) return false;\n      \n      // Transform point into element local space to check handle\n      // Translate back from center\n      const dx = px - b.x;\n      const dy = py - b.y;\n      // Rotate back\n      const rad = -b.angle * Math.PI / 180;\n      const lx = dx * Math.cos(rad) - dy * Math.sin(rad);\n      const ly = dx * Math.sin(rad) + dy * Math.cos(rad);\n      \n      let hx = b.w/2 + 10; // Default center align\n      if (target === 'name' || target === 'details') {\n          if (align === 'left') hx = b.w + 10; \n          else if (align === 'right') hx = 10;\n          else hx = b.w/2 + 10; \n      }\n      const hy = b.h/2 + 10;\n      \n      const dist = Math.hypot(lx - hx, ly - hy);\n      return dist < 40; // Hit radius\n  }\n\n  const handlePointerDown = (e: React.PointerEvent) => {\n      if (isPreviewMode) return; // Disable interaction in preview mode\n      e.currentTarget.setPointerCapture(e.pointerId);\n      const canvas = canvasRef.current;\n      if (!canvas) return;\n      \n      const { x, y } = getPointerLocal(e, canvas);\n      \n      // Check handles of currently selected target first\n      if (dragTarget !== 'none') {\n          const stateAlign = dragTarget === 'name' ? initialState.namePos.align : dragTarget === 'details' ? initialState.detailsPos.align : 'center';\n          if (checkHandleHit(x, y, dragTarget, stateAlign)) {\n              setDragAction('scale');\n              pointerStart.current = { x: e.clientX, y: e.clientY };\n              const targetKey = dragTarget === 'qr' ? 'qrPos' : dragTarget === 'name' ? 'namePos' : dragTarget === 'details' ? 'detailsPos' : 'photoPos';\n              initialElPos.current = { ...initialState[targetKey] };\n              return;\n          }\n      }\n\n      // Check Bodies (Hit Test)\n      // Priority: QR > Details > Name > Photo\n      const targets: DragTarget[] = ['qr', 'details', 'name', 'photo'];\n      for (const t of targets) {\n          const b = elementBounds.current.get(t);\n          if (!b) continue;\n          \n          if (Math.hypot(x - b.x, y - b.y) < Math.max(b.w, b.h)/2) {\n               setDragTarget(t);\n               setDragAction('move');\n               pointerStart.current = { x: e.clientX, y: e.clientY };\n               const targetKey = t === 'qr' ? 'qrPos' : t === 'name' ? 'namePos' : t === 'details' ? 'detailsPos' : 'photoPos';\n               initialElPos.current = { ...initialState[targetKey] };\n               return;\n          }\n      }\n      \n      // If nothing hit, deselect\n      setDragTarget('none');\n  };\n\n  const handlePointerMove = (e: React.PointerEvent) => {\n      if (!pointerStart.current || !initialElPos.current || dragTarget === 'none' || isPreviewMode) return;\n      \n      const canvas = canvasRef.current;\n      if (!canvas) return;\n      const rect = canvas.getBoundingClientRect();\n      \n      if (dragAction === 'move') {\n          const dx = (e.clientX - pointerStart.current.x) / rect.width;\n          const dy = (e.clientY - pointerStart.current.y) / rect.height;\n          \n          const newState = { ...initialState };\n          const targetKey = dragTarget === 'qr' ? 'qrPos' : dragTarget === 'name' ? 'namePos' : dragTarget === 'details' ? 'detailsPos' : 'photoPos';\n          \n          newState[targetKey] = { \n              ...initialElPos.current, \n              x: initialElPos.current.x + dx, \n              y: initialElPos.current.y + dy \n          };\n          onChange(newState);\n\n      } else if (dragAction === 'scale') {\n          const dy = (e.clientY - pointerStart.current.y); \n          // Sensitivity\n          const scaleDelta = dy * 0.005;\n          const newState = { ...initialState };\n          const targetKey = dragTarget === 'qr' ? 'qrPos' : dragTarget === 'name' ? 'namePos' : dragTarget === 'details' ? 'detailsPos' : 'photoPos';\n          \n          const newScale = Math.max(0.1, initialElPos.current.scale + scaleDelta);\n          newState[targetKey] = { ...initialElPos.current, scale: newScale };\n          onChange(newState);\n      }\n  };\n\n  const handlePointerUp = () => {\n      setDragAction('move');\n      pointerStart.current = null;\n  };\n\n  const applyPreset = (presetId: string) => {\n      const preset = MEISHI_PRESETS.find(p => p.id === presetId);\n      if (preset) {\n          onChange({ ...initialState, ...preset.state });\n      }\n  };\n\n  const handleSave = (asA4: boolean = false) => {\n      setIsProcessing(true);\n      setProcessingType(asA4 ? 'a4' : 'card');\n      \n      // Small delay to allow spinner render\n      setTimeout(() => {\n          if (asA4) {\n              // A4 Export Logic\n              const a4Canvas = document.createElement('canvas');\n              // 300 DPI A4\n              a4Canvas.width = 2480;\n              a4Canvas.height = 3508;\n              const ctx = a4Canvas.getContext('2d');\n              if (ctx && loadedImg) {\n                  ctx.fillStyle = '#ffffff';\n                  ctx.fillRect(0, 0, a4Canvas.width, a4Canvas.height);\n                  \n                  // Create single card canvas first\n                  const cardCvs = document.createElement('canvas');\n                  cardCvs.width = width;\n                  cardCvs.height = height;\n                  const cardCtx = cardCvs.getContext('2d');\n                  if (cardCtx) draw(cardCtx, loadedImg, true);\n\n                  // Layout params (approx for A4 standard business card sheets like A-one 51002)\n                  const cardW = width;\n                  const cardH = height;\n                  const startX = (a4Canvas.width - (cardW * 2)) / 2;\n                  const startY = (a4Canvas.height - (cardH * 5)) / 2;\n                  \n                  // Draw Cards\n                  for(let row=0; row<5; row++) {\n                      for(let col=0; col<2; col++) {\n                          ctx.drawImage(cardCvs, startX + col * cardW, startY + row * cardH);\n                      }\n                  }\n\n                  // Draw Cut Lines (Dashed Guide)\n                  ctx.strokeStyle = '#9ca3af'; // Gray-400\n                  ctx.lineWidth = 2;\n                  ctx.setLineDash([20, 20]); // Dashed\n\n                  // Vertical Lines (Left, Center, Right)\n                  for (let i = 0; i <= 2; i++) {\n                      const x = startX + i * cardW;\n                      ctx.beginPath();\n                      ctx.moveTo(x, Math.max(0, startY - 100)); \n                      ctx.lineTo(x, Math.min(a4Canvas.height, startY + cardH * 5 + 100));\n                      ctx.stroke();\n                  }\n\n                  // Horizontal Lines\n                  for (let i = 0; i <= 5; i++) {\n                      const y = startY + i * cardH;\n                      ctx.beginPath();\n                      ctx.moveTo(Math.max(0, startX - 100), y);\n                      ctx.lineTo(Math.min(a4Canvas.width, startX + cardW * 2 + 100), y);\n                      ctx.stroke();\n                  }\n                  \n                  // Reset dash\n                  ctx.setLineDash([]);\n                  \n                  // Instead of downloading, show preview\n                  const dataUrl = a4Canvas.toDataURL('image/png', 0.8);\n                  setA4PreviewSrc(dataUrl);\n              }\n          } else {\n              // Single Card Export\n              const exportCanvas = document.createElement('canvas');\n              exportCanvas.width = width;\n              exportCanvas.height = height;\n              const ctx = exportCanvas.getContext('2d');\n              if (ctx && loadedImg) {\n                  draw(ctx, loadedImg, true);\n                  const link = document.createElement('a');\n                  link.download = `cos-meishi-${Date.now()}.png`;\n                  link.href = exportCanvas.toDataURL('image/png', 1.0);\n                  document.body.appendChild(link);\n                  link.click();\n                  document.body.removeChild(link);\n              }\n          }\n          \n          setIsProcessing(false);\n          if (!asA4) onClose(); // Only close on single save\n      }, 100);\n  };\n\n  const downloadA4 = () => {\n      if (!a4PreviewSrc) return;\n      const link = document.createElement('a');\n      link.download = `cos-meishi-a4-${Date.now()}.png`;\n      link.href = a4PreviewSrc;\n      document.body.appendChild(link);\n      link.click();\n      document.body.removeChild(link);\n      setA4PreviewSrc(null); \n  };\n\n  const handleFontUpload = async (e: React.ChangeEvent<HTMLInputElement>) => {\n      const file = e.target.files?.[0];\n      if(!file) return;\n      try {\n          const buffer = await file.arrayBuffer();\n          const fontName = `Custom-${Date.now()}`;\n          const font = new FontFace(fontName, buffer);\n          await font.load();\n          (document.fonts as any).add(font);\n          setCustomFonts(prev => [...prev, { name: file.name.split('.')[0], family: fontName }]);\n          onChange({...initialState, fontFamily: file.name.split('.')[0]});\n      } catch (err) {\n          alert(\"フォントの読み込みに失敗しました\");\n      }\n  };\n  \n  const updateAlign = (target: 'name' | 'details', align: 'left' | 'center' | 'right') => {\n      if (target === 'name') onChange({...initialState, namePos: { ...initialState.namePos, align }});\n      if (target === 'details') onChange({...initialState, detailsPos: { ...initialState.detailsPos, align }});\n  }\n\n  return (\n    <div className=\"fixed inset-0 z-[60] bg-zinc-900 flex flex-col animate-fade-in\">\n        {/* A4 Preview Modal */}\n        {a4PreviewSrc && (\n            <div className=\"fixed inset-0 z-[70] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4\">\n                <div className=\"bg-zinc-900 border border-white/10 rounded-2xl flex flex-col max-w-lg w-full h-[80vh] shadow-2xl overflow-hidden animate-slide-up\">\n                    <div className=\"flex justify-between items-center p-4 border-b border-white/10 bg-zinc-800\">\n                        <h3 className=\"text-white font-bold flex items-center gap-2\">\n                            <span className=\"text-xl\">🖨️</span> A4印刷プレビュー\n                        </h3>\n                        <button onClick={() => setA4PreviewSrc(null)} className=\"text-white/50 hover:text-white\"><IconX className=\"w-6 h-6\"/></button>\n                    </div>\n                    <div className=\"flex-1 overflow-auto p-4 bg-zinc-950 flex justify-center\">\n                        <img src={a4PreviewSrc} alt=\"A4 Preview\" className=\"max-w-full h-auto object-contain shadow-lg\" />\n                    </div>\n                    <div className=\"p-4 border-t border-white/10 bg-zinc-800 flex gap-3 justify-end\">\n                        <Button variant=\"secondary\" onClick={() => setA4PreviewSrc(null)}>キャンセル</Button>\n                        <Button variant=\"primary\" onClick={downloadA4} className=\"flex items-center gap-2\">\n                            <IconDownload className=\"w-5 h-5\"/> 保存する\n                        </Button>\n                    </div>\n                </div>\n            </div>\n        )}\n\n        {/* Header */}\n        <div className=\"h-14 px-4 flex items-center justify-between border-b border-white/10 bg-black/50 shrink-0\">\n            <h2 className=\"font-bold text-white flex items-center gap-2\">\n                <span className=\"text-xl\">📇</span> 名刺メーカー\n            </h2>\n            <div className=\"flex gap-2 items-center\">\n                {isPreviewMode ? (\n                    <button \n                        onClick={() => setIsPreviewMode(false)}\n                        className=\"px-4 py-1.5 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-xl transition-all\"\n                    >\n                        編集に戻る\n                    </button>\n                ) : (\n                    <>\n                        <button onClick={() => setIsPreviewMode(true)} className=\"p-2 text-white/60 hover:text-white\" title=\"プレビュー\">\n                            <IconEye className=\"w-5 h-5\"/>\n                        </button>\n                        <button onClick={onClose} className=\"px-3 py-1 text-white/60 text-xs hover:text-white\">閉じる</button>\n                        <button \n                            onClick={() => handleSave(true)}\n                            disabled={isProcessing}\n                            className=\"px-4 py-1 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-xl flex items-center gap-2 transition-all disabled:opacity-50\"\n                        >\n                            {isProcessing && processingType === 'a4' ? <Spinner/> : 'A4印刷用'}\n                        </button>\n                        <Button variant=\"primary\" onClick={() => handleSave(false)} className=\"!py-1 !px-4\">\n                            {isProcessing && processingType === 'card' ? <Spinner/> : '保存'}\n                        </Button>\n                    </>\n                )}\n            </div>\n        </div>\n\n        {/* Canvas Container */}\n        <div className=\"flex-1 bg-zinc-950 relative overflow-hidden flex items-center justify-center p-4 touch-none select-none\">\n            <div \n                className=\"relative shadow-2xl transition-all duration-300\" \n                style={{ \n                    aspectRatio: `${width}/${height}`, \n                    maxHeight: isPreviewMode ? '85vh' : '50vh', \n                    maxWidth: isPreviewMode ? '95%' : '90%', \n                    height: 'auto', \n                    width: 'auto' \n                }}\n            >\n                 <canvas \n                    ref={canvasRef}\n                    width={width}\n                    height={height}\n                    className=\"w-full h-full object-contain bg-transparent cursor-move\"\n                    onPointerDown={handlePointerDown}\n                    onPointerMove={handlePointerMove}\n                    onPointerUp={handlePointerUp}\n                    onPointerLeave={handlePointerUp}\n                 />\n                 {!isPreviewMode && (\n                     <div className=\"absolute bottom-2 left-2 pointer-events-none bg-black/50 text-white text-[10px] px-2 py-1 rounded backdrop-blur opacity-50\">\n                        要素をタップ選択・ドラッグで移動・右下ハンドルで拡大縮小\n                     </div>\n                 )}\n            </div>\n        </div>\n\n        {/* Controls */}\n        {!isPreviewMode && (\n            <div className=\"bg-zinc-900 border-t border-white/10 h-[45vh] max-h-[450px] flex flex-col shrink-0 pb-safe\">\n                <div className=\"flex border-b border-white/10 bg-black/20\">\n                    {[\n                        {id:'templates', label:'プリセット'},\n                        {id:'content', label:'文字・情報'},\n                        {id:'style', label:'デザイン'},\n                        {id:'arrange', label:'配置・写真'}\n                    ].map(t => (\n                        <button \n                            key={t.id} \n                            onClick={() => setActiveTab(t.id as EditorTab)} \n                            className={`flex-1 py-3 text-xs font-bold border-b-2 transition-colors ${activeTab === t.id ? 'text-cos-accent border-cos-accent bg-white/5' : 'text-white/50 border-transparent'}`}\n                        >\n                            {t.label}\n                        </button>\n                    ))}\n                </div>\n\n                <div className=\"flex-1 overflow-y-auto p-4 space-y-6\">\n                    {/* --- TEMPLATES --- */}\n                    {activeTab === 'templates' && (\n                        <div className=\"grid grid-cols-2 gap-3\">\n                            {MEISHI_PRESETS.map(p => (\n                                <button \n                                    key={p.id} \n                                    onClick={() => applyPreset(p.id)}\n                                    className=\"p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 hover:border-cos-accent text-left transition-all group\"\n                                >\n                                    <div className=\"text-sm font-bold text-white group-hover:text-cos-accent\">{p.label}</div>\n                                    <div className=\"text-[10px] text-white/40 mt-1\">\n                                        {p.state.isVertical ? '縦型' : '横型'} / {p.state.frameStyle !== 'none' ? '枠あり' : '枠なし'}\n                                    </div>\n                                </button>\n                            ))}\n                        </div>\n                    )}\n\n                    {/* --- CONTENT --- */}\n                    {activeTab === 'content' && (\n                        <div className=\"space-y-4 max-w-lg mx-auto\">\n                            <div className=\"p-3 bg-white/5 rounded-xl border border-white/5\">\n                                <div className=\"flex justify-between items-center mb-2\">\n                                    <label className=\"text-[10px] text-white/50 uppercase\">名前</label>\n                                    <div className=\"flex items-center gap-2\">\n                                        <input type=\"color\" value={initialState.nameColor || initialState.textColor} onChange={e => onChange({...initialState, nameColor: e.target.value})} className=\"w-6 h-6 rounded border-none bg-transparent\"/>\n                                        <div className=\"flex bg-black/30 rounded-lg p-0.5\">\n                                            <button onClick={() => updateAlign('name', 'left')} className={`p-1.5 rounded ${initialState.namePos.align === 'left' ? 'bg-white/20 text-white' : 'text-white/30'}`}><IconAlignLeft className=\"w-4 h-4\"/></button>\n                                            <button onClick={() => updateAlign('name', 'center')} className={`p-1.5 rounded ${initialState.namePos.align === 'center' || !initialState.namePos.align ? 'bg-white/20 text-white' : 'text-white/30'}`}><IconAlignCenter className=\"w-4 h-4\"/></button>\n                                            <button onClick={() => updateAlign('name', 'right')} className={`p-1.5 rounded ${initialState.namePos.align === 'right' ? 'bg-white/20 text-white' : 'text-white/30'}`}><IconAlignRight className=\"w-4 h-4\"/></button>\n                                        </div>\n                                    </div>\n                                </div>\n                                <input type=\"text\" value={initialState.name} onChange={e => onChange({...initialState, name: e.target.value})} className=\"w-full bg-black/30 border border-white/10 rounded-lg p-2 text-white mb-2\" />\n                                <input type=\"range\" min=\"0.5\" max=\"5.0\" step=\"0.1\" value={initialState.namePos.scale} onChange={e => onChange({...initialState, namePos: {...initialState.namePos, scale: Number(e.target.value)}})} className=\"w-full h-1 bg-white/20 rounded-lg appearance-none accent-cos-accent\" />\n                            </div>\n                            \n                            <div className=\"p-3 bg-white/5 rounded-xl border border-white/5\">\n                                <div className=\"flex justify-between items-center mb-2\">\n                                    <label className=\"text-[10px] text-white/50 uppercase\">詳細情報 (ID/フリー)</label>\n                                    <div className=\"flex items-center gap-2\">\n                                        <input type=\"color\" value={initialState.detailsColor || initialState.textColor} onChange={e => onChange({...initialState, detailsColor: e.target.value})} className=\"w-6 h-6 rounded border-none bg-transparent\"/>\n                                        <div className=\"flex bg-black/30 rounded-lg p-0.5\">\n                                            <button onClick={() => updateAlign('details', 'left')} className={`p-1.5 rounded ${initialState.detailsPos.align === 'left' ? 'bg-white/20 text-white' : 'text-whit \n                                    onChange={e => onChange({...initialState, fontFamily: e.target.value})}\n                                    className=\"w-full bg-black/30 border border-white/20 rounded-lg p-2 text-white text-sm\"\n                                >\n                                    <optgroup label=\"標準フォント\">\n                                        {AVAILABLE_FONTS.map(f => (\n                                            <option key={f.name} value={f.name}>{f.name}</option>\n                                        ))}\n                                    </optgroup>\n                                    {customFonts.length > 0 && (\n                                        <optgroup label=\"カスタム\">\n                                            {customFonts.map(f => (\n                                                <option key={f.name} value={f.name}>{f.name}</option>\n                                            ))}\n                                        </optgroup>\n                                    )}\n                                </select>\n                            </div>\n\n                            <div>\n                                <label className=\"text-[10px] text-white/50 uppercase mb-2 block\">文字の太さ ({initialState.fontWeight || 700})</label>\n                                <input \n                                    type=\"range\" min=\"100\" max=\"900\" step=\"100\"\n                                    value={initialState.fontWeight || 700} \n                                    onChange={e => onChange({...initialState, fontWeight: Number(e.target.value)})}\n                                    className=\"w-full h-1 bg-white/20 rounded-lg appearance-none accent-cos-accent\" \n                                />\n                            </div>\n\n                            <div className=\"p-3 bg-white/5 rounded-xl space-y-3\">\n                                <label className=\"text-[10px] text-white/50 upperca                    </div>\n                                <div className=\"flex overflow-x-auto gap-2 no-scrollbar pb-1\">\n                                    {(['none', 'simple', 'thick', 'double', 'corners', 'bracket', 'cyber', 'modern', 'top-bottom'] as const).map(s => (\n                                        <button key={s} onClick={() => onChange({...initialState, frameStyle: s})} className={`px-3 py-1.5 text-xs whitespace-nowrap rounded-full border ${initialState.frameStyle === s ? 'border-cos-accent bg-cos-accent text-white' : 'border-white/20 text-white/50'}`}>{s}</button>\n                                    ))}\n                                </div>\n                            </div>\n\n                            <div>\n                                <label className=\"text-[10px] text-white/50 uppercase mb-2 block\">QRコード</label>\n                                <div className=\"flex gap-3 items-center\">\n                                    <div className=\"flex gap-1 bg-white/5 p-1 rounded-lg\">\n                                        {(['normal', 'dots', 'rounded'] as const).map(s => (\n                                            <button key={s} onClick={() => onChange({...initialState, qrStyle: s})} className={`px-3 py-1 text-xs rounded ${initialState.qrStyle === s ? 'bg-white/20 text-white' : 'text-white/50'}`}>{s}</button>\n                                        ))}\n                                    </div>\n                                    <input type=\"color\" value={initialState.qrColor} onChange={e => onChange({...initialState, qrColor: e.target.value})} className=\"w-8 h-8 rounded bg-transparent border border-white/20\" title=\"QR Color\"/>\n                                    <div className=\"flex items-center gap-2 ml-auto\">\n                                        <span className=\"text-[10px] text-white/50\">背景</span>\n                                        <input type=\"checkbox\" checked={initialState.qrBgColor !== 'transparent'} onChange={e => onChange({...initialState, qrBgColor: e.target.checked ? '#ffffff' : 'transparent'})} className=\"accent-cos-accent\"/>\n                                    </div>\n                                </div>\n                            </div>\n                            \n                            <div className=\"flex gap-4 pt-2 border-t border-white/5\">\n                                 <label className=\"flex items-center gap-2 text-xs text-white/70 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.textShadow} onChange={e => onChange({...initialState, textShadow: e.target.checked})} className=\"accent-cos-accent\" />\n                                     文字の影\n                                 </label>\n                                 <label className=\"flex items-center gap-2 text-xs text-white/70 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.textStroke} onChange={e => onChange({...initialState, textStroke: e.target.checked})} className=\"accent-cos-accent\" />\n                                     文字の縁取り\n                                 </label>\n                            </div>\n                        </div>\n                    )}\n\n                    {/* --- ARRANGE --- */}\n                    {activeTab === 'arrange' && (\n                        <div className=\"space-y-6 max-w-lg mx-auto\">\n                            <Button variant=\"secondary\" fullWidth onClick={onEditImage}>写真の編集に戻る (美肌・フィルター)</Button>\n\n                            <div className=\"grid grid-cols-2 gap-4\">\n                                <button onClick={() => onChange({...initialState, isVertical: !initialState.isVertical})} className=\"p-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm flex items-center justify-center gap-2\">\n                                    <span>🔄</span> {initialState.isVertical ? '横向きにする' : '縦向きにす    className={`flex-1 py-2 text-[10px] rounded border ${initialState.photoPos.fit === 'stretch' ? 'bg-cos-accent border-cos-accent text-white' : 'bg-black/30 border-white/10 text-white/70'}`}\n                                    >\n                                        変形 (Fill)\n                                    </button>\n                                 </div>\n                                 \n                                 <div className=\"flex items-center gap-3\">\n                                    <span className=\"text-xs w-8 text-white/60\">回転</span>\n                                    <input \n                                        type=\"range\" min=\"-180\" max=\"180\" step=\"1\" \n                                        value={initialState.photoPos.rotate || 0} \n                                        onChange={e => onChange({...initialState, photoPos: {...initialState.photoPos, rotate: Number(e.target.value)}})} \n                                        className=\"flex-1 h-1 bg-white/20 rounded-lg appearance-none accent-cos-accent\" \n                                    />\n                                    <button onClick={() => onChange({...initialState, photoPos: {...initialState.photoPos, rotate: 0}})} className=\"text-xs text-white/40\">R</button>\n                                 </div>\n                            </div>\n                            \n                            <div className=\"grid grid-cols-4 gap-2 pt-2\">\n                                 <label className=\"flex flex-col items-center gap-1 text-[10px] text-white/60 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.photoPos.visible} onChange={e => onChange({...initialState, photoPos: {...initialState.photoPos, visible: e.target.checked}})} className=\"accent-cos-accent\" />\n                                     写真\n                                 </label>\n                                 <label className=\"flex flex-col items-center gap-1 text-[10px] text-white/60 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.namePos.visible} onChange={e => onChange({...initialState, namePos: {...initialState.namePos, visible: e.target.checked}})} className=\"accent-cos-accent\" />\n                                     名前\n                                 </label>\n                                 <label className=\"flex flex-col items-center gap-1 text-[10px] text-white/60 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.detailsPos.visible} onChange={e => onChange({...initialState, detailsPos: {...initialState.detailsPos, visible: e.target.checked}})} className=\"accent-cos-accent\" />\n                                     詳細\n                                 </label>\n                                 <label className=\"flex flex-col items-center gap-1 text-[10px] text-white/60 cursor-pointer\">\n                                     <input type=\"checkbox\" checked={initialState.qrPos.visible} onChange={e => onChange({...initialState, qrPos: {...initialState.qrPos, visible: e.target.checked}})} className=\"accent-cos-accent\" />\n                                     QR\n                                 </label>\n                            </div>\n                        </div>\n                    )}\n                </div>\n            </div>\n        )}\n    </div>\n  );\n};\n","components/Slider.tsx":"\nimport React, { useRef, useState, useEffect } from 'react';\n\ninterface SliderProps {\n  label?: string;\n  value: number;\n  min: number;\n  max: number;\n  step?: number;\n  onChange: (val: number) => void;\n  onReset?: () => void;\n  unit?: string;\n  disabled?: boolean;\n  className?: string;\n}\n\nexport const Slider: React.FC<SliderProps> = ({\n  label,\n  value,\n  min,\n  max,\n  step = 1,\n  onChange,\n  onReset,\n  unit = '',\n  disabled = false,\n  className = ''\n}) => {\n  const trackRef = useRef<HTMLDivElement>(null);\n  const [isDragging, setIsDragging] = useState(false);\n\n  // Calculate percentage for track fill\n  const percentage = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));\n\n  const handlePointerDown = (e: React.PointerEvent) => {\n    if (disabled) return;\n    setIsDragging(true);\n    e.currentTarget.setPointerCapture(e.pointerId);\n    updateValue(e.clientX);\n  };\n\n  const handlePointerMove = (e: React.PointerEvent) => {\n    if (isDragging && !disabled) {\n      updateValue(e.clientX);\n    }\n  };\n\n  const handlePointerUp = (e: React.PointerEvent) => {\n    setIsDragging(false);\n    e.currentTarget.releasePointerCapture(e.pointerId);\n  };\n\n  const updateValue = (clientX: number) => {\n    if (!trackRef.current) return;\n    const rect = trackRef.current.getBoundingClientRect();\n    const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));\n    const rawValue = min + x * (max - min);\n    \n    // Snap to step\n    const steppedValue = Math.round(rawValue / step) * step;\n    const clampedValue = Math.max(min, Math.min(max, steppedValue));\n    \n    // Prevent unnecessary updates\n    if (clampedValue !== value) {\n        onChange(clampedValue);\n    }\n  };\n\n  // Double tap/click to reset\n  const handleDoubleClick = () => {\n      if (onReset && !disabled) onReset();\n  };\n\n  return (\n    <div className={`space-y-2 touch-none select-none ${disabled ? 'opacity-50' : ''} ${className}`}>\n      {label && (\n        <div className=\"flex justify-between items-center text-[11px] font-bold tracking-wide text-white/70\">\n          <span>{label}</span>\n          <span className=\"font-mono text-cos-accent\">\n            {value > 0 && min < 0 ? '+' : ''}{Math.round(value * 100) / 100}{unit}\n          </span>\n        </div>\n      )}\n      \n      <div \n        className=\"relative h-8 flex items-center cursor-pointer group\"\n        onPointerDown={handlePointerDown}\n        onPointerMove={handlePointerMove}\n        onPointerUp={handlePointerUp}\n        onDoubleClick={handleDoubleClick}\n      >\n        {/* Track Background */}\n        <div \n            ref={trackRef}\n            className=\"absolute left-0 right-0 h-1.5 bg-white/10 rounded-full overflow-hidden border border-white/5\"\n        >\n            {/* Fill Bar */}\n            <div \n                className=\"h-full bg-gradient-to-r from-cos-accent/80 to-cos-accent transition-all duration-75 ease-out\"\n                style={{ width: `${percentage}%` }}\n            />\n        </div>\n\n        {/* Thumb (Visual Only, follows percentage) */}\n        <div \n            className={`absolute h-5 w-5 bg-white rounded-full shadow-lg border-2 border-cos-accent transform -translate-x-1/2 transition-transform duration-100 ease-out ${isDragging ? 'scale-125' : 'scale-100 group-hover:scale-110'}`}\n            style={{ left: `${percentage}%` }}\n        />\n      </div>\n    </div>\n  );\n};\n","components/Spinner.tsx":"import React from 'react';\n\nexport const Spinner: React.FC = () => (\n  <svg className=\"animate-spin h-8 w-8 text-cos-accent\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\">\n    <circle className=\"opacity-25\" cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" strokeWidth=\"4\"></circle>\n    <path className=\"opacity-75\" fill=\"currentColor\" d=\"M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z\"></path>\n  </svg>\n);"}

    <!-- エラーハンドリング -->
    <script>
        window.showError = function(title, err) {
            const loader = document.getElementById('loader');
            if (loader) {
                const spinner = loader.querySelector('.spinner');
                if(spinner) spinner.remove();

                loader.innerHTML = 
                    '<div style="color: #ef4444; text-align: center; padding: 20px; max-width: 90%;">' +
                    '<h2 style="margin-bottom: 10px; font-weight: bold; font-size: 1.2em;">' + title + '</h2>' +
                    '<pre style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; text-align: left; overflow: auto; font-size: 12px; max-height: 50vh; margin-bottom: 20px;">' + 
                    (err.message || err) + '\n' + (err.stack || '') + '</pre>' +
                    '<button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer; border:none; background: #3b82f6; color: white; border-radius: 6px; font-weight: bold;">ページを再読み込み</button>' +
                    '</div>';
            }
            console.error(title, err);
        };

        window.addEventListener('error', function(event) {
            if (event.message && event.message.includes('ResizeObserver')) return;
            window.showError('Runtime Error', event.error || event.message);
        });
        
        window.addEventListener('unhandledrejection', function(event) {
            window.showError('Unhandled Promise Rejection', event.reason);
        });
    </script>

    <!-- ブートローダーロジック -->
    <script type="module">
        const log = (msg) => {
            const el = document.getElementById('boot-log');
            if (el) el.innerText = msg;
            console.log('[Boot]', msg);
        };

        // 仮想ルート識別子 (スラッシュなし)
        // これをすべての内部モジュールのプレフィックスとして使用し、Import Mapで解決します。
        const ROOT_ID = 'root';

        /**
         * パス解決ロジック
         * ファイルパスを正規化し、常に "root/path/to/file" の形式（先頭スラッシュなし）を返します。
         */
        function resolvePath(basePath, relativePath) {
            // basePath: "root/components/Header.tsx"
            // relativePath: "./Button" 
            
            // エイリアス対応: "@/" で始まる場合はルートからのパスとして扱う
            if (relativePath.startsWith('@/')) {
                // "@/" を除去し、ルートIDを付与
                return ROOT_ID + '/' + relativePath.substring(2);
            }

            // ベースとなるディレクトリパスの配列を作成
            let parts = basePath.split('/');
            parts.pop(); // ファイル名を除去 -> ["root", "components"]
            
            // 入力が絶対パスの場合 ("/utils/helper")
            // プロジェクトルートからのパスとして扱い、スタックをリセット
            if (relativePath.startsWith('/')) {
                parts = [ROOT_ID];
                relativePath = relativePath.substring(1);
            }
            
            const relParts = relativePath.split('/');
            
            for (const part of relParts) {
                if (part === '' || part === '.') continue;
                if (part === '..') {
                    // ルート("root")より上には行けないようにガード
                    if (parts.length > 1) parts.pop();
                } else {
                    parts.push(part);
                }
            }
            
            // ["root", "components", "Button"] -> "root/components/Button"
            return parts.join('/');
        }

        async function boot() {
            try {
                // 1. データの読み込み
                log('ファイルシステムを展開中...');
                const filesElement = document.getElementById('project-files');
                const configElement = document.getElementById('env-config');
                
                if (!filesElement || !filesElement.textContent) throw new Error("Project files not found.");
                
                const rawFiles = JSON.parse(filesElement.textContent);
                const envConfig = JSON.parse(configElement.textContent || '{}');
                
                // 2. 環境変数の設定
                window.process = {
                    env: {
                        NODE_ENV: 'production',
                        ...envConfig
                    }
                };

                // 3. モジュールシステムの準備
                log('モジュールシステムを構築中...');
                const localImportMap = { imports: {} };
                const createModuleBlob = (code, type = 'text/javascript') => URL.createObjectURL(new Blob([code], { type }));

                // モジュール登録関数
                const registerModule = (filePath, content, isBinary = false) => {
                    let blobUrl;
                    if (isBinary) {
                        blobUrl = createModuleBlob(`export default "${content}";`);
                    } else {
                        blobUrl = createModuleBlob(content);
                    }

                    // 入力filePathは "App.tsx" や "components/Header.tsx" (先頭スラッシュなし) を想定
                    if (filePath.startsWith('/')) filePath = filePath.substring(1);

                    // 仮想パス: "root/App.tsx"
                    const virtualPath = `${ROOT_ID}/${filePath}`;
                    
                    // 1. 正確なパス ("root/App.tsx")
                    localImportMap.imports[virtualPath] = blobUrl;
                    
                    // 2. 拡張子なし ("root/App")
                    const noExt = virtualPath.replace(/.[^/.]+$/, "");
                    if (noExt !== virtualPath) {
                        localImportMap.imports[noExt] = blobUrl;
                    }
                    
                    // 3. ディレクトリインデックス ("root/components" -> "root/components/index.tsx")
                    if (filePath.endsWith('/index.tsx') || filePath.endsWith('/index.ts') || filePath.endsWith('/index.js')) {
                        const dirPath = virtualPath.split('/').slice(0, -1).join('/');
                        localImportMap.imports[dirPath] = blobUrl;
                    }
                };

                // 4. ファイル処理
                const allPaths = Object.keys(rawFiles);
                const codeFiles = allPaths.filter(f => f.match(/.(tsx|ts|jsx|js)$/));
                const cssFiles = allPaths.filter(f => f.endsWith('.css'));
                const jsonFiles = allPaths.filter(f => f.endsWith('.json'));
                const assetFiles = allPaths.filter(f => !codeFiles.includes(f) && !cssFiles.includes(f) && !jsonFiles.includes(f));
                
                // CSS
                for (const path of cssFiles) {
                    const style = document.createElement('style');
                    // @tailwind ディレクティブが含まれていてもCDN版とは競合しないためそのまま注入
                    style.textContent = rawFiles[path];
                    document.head.appendChild(style);
                    registerModule(path, "export default {};");
                }
                
                // Assets
                for (const path of assetFiles) {
                    registerModule(path, rawFiles[path], true);
                }
                
                // JSON
                for (const path of jsonFiles) {
                    try {
                        registerModule(path, `export default ${rawFiles[path]};`);
                    } catch(e) {}
                }

                if (typeof Babel === 'undefined') throw new Error("Babel not loaded");

                // カスタムBabelプラグイン: インポートパス書き換え
                const rewriteImportsPlugin = {
                    visitor: {
                        "ImportDeclaration|ExportNamedDeclaration|ExportAllDeclaration"(path, state) {
                            if (!path.node.source) return;
                            const source = path.node.source.value;
                            const currentFile = state.file.opts.filename; // "root/App.tsx"

                            // 相対パス, ルート絶対パス, またはエイリアス(@/)の場合書き換え
                            if (source.startsWith('.') || source.startsWith('/') || source.startsWith('@/')) {
                                const resolved = resolvePath(currentFile, source);
                                // 重要: 生成されるパスに先頭スラッシュが含まれないことを保証
                                path.node.source.value = resolved.startsWith('/') ? resolved.substring(1) : resolved;
                            }
                        },
                        CallExpression(path, state) {
                            if (path.node.callee.type === 'Import') {
                                const arg = path.node.arguments[0];
                                if (arg.type === 'StringLiteral') {
                                    const source = arg.value;
                                    const currentFile = state.file.opts.filename;
                                    if (source.startsWith('.') || source.startsWith('/') || source.startsWith('@/')) {
                                        const resolved = resolvePath(currentFile, source);
                                        arg.value = resolved.startsWith('/') ? resolved.substring(1) : resolved;
                                    }
                                }
                            }
                        }
                    }
                };

                // コンパイル実行
                log(`${codeFiles.length}個のソースファイルをコンパイル中...`);
                
                for (const path of codeFiles) {
                    let cleanPath = path.startsWith('/') ? path.substring(1) : path;
                    const code = rawFiles[path];
                    try {
                        const result = Babel.transform(code, {
                            presets: [
                                [Babel.availablePresets["typescript"], { isTSX: true, allExtensions: true }],
                                [Babel.availablePresets["react"]]
                            ],
                            // Babelに渡すファイル名も "root/App.tsx" 形式にする
                            filename: `${ROOT_ID}/${cleanPath}`, 
                            plugins: [rewriteImportsPlugin]
                        });
                        registerModule(cleanPath, result.code);
                    } catch (e) {
                        console.error("Transpile Error:", path, e);
                        throw new Error(`Failed to compile ${path}: ${e.message}`);
                    }
                }

                // 5. Import Map 注入
                const mapScript = document.createElement('script');
                mapScript.type = "importmap";
                
                const existingMapEl = document.querySelector('script[type="importmap"]');
                let finalMap = localImportMap;
                
                if (existingMapEl) {
                    try {
                        const existing = JSON.parse(existingMapEl.textContent);
                        // 既存のマッピング（React等）を維持しつつ、ローカルファイルをマージ
                        finalMap = { imports: { ...existing.imports, ...localImportMap.imports } };
                        existingMapEl.remove();
                    } catch(e) {}
                }
                
                mapScript.textContent = JSON.stringify(finalMap);
                document.head.appendChild(mapScript);
                
                // Map適用待ち
                await new Promise(r => setTimeout(r, 50));

                // 6. アプリケーション起動
                log('アプリケーションを起動します...');
                
                // エントリーポイントの特定
                const entryCandidates = ['index.tsx', 'main.tsx', 'index.js', 'main.js', 'src/index.tsx', 'src/main.tsx'];
                let entryFile = entryCandidates.find(f => rawFiles[f]) || 
                                Object.keys(rawFiles).find(f => f.endsWith('/index.tsx') || f.endsWith('/main.tsx'));
                
                if (!entryFile) throw new Error("エントリーポイント(index.tsx 等)が見つかりません。");
                if (entryFile.startsWith('/')) entryFile = entryFile.substring(1);

                // エントリーポイントのモジュールID ("root/index")
                const entryModuleId = `${ROOT_ID}/${entryFile.replace(/.[^/.]+$/, "")}`;
                
                log(`Mounting ${entryModuleId}...`);
                await import(entryModuleId);
                
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }

            } catch (err) {
                window.showError('起動エラー', err);
            }
        }

        boot();
    </script>
</body>
</html>
